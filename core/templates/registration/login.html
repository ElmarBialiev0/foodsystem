{% extends 'base.html' %}
{% block title %}Вход{% endblock %}
{% block header %}🔐 Авторизация{% endblock %}

{% block content %}
<form method="post" action="{% url 'login' %}">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Войти</button>
</form>

{% if form.errors %}
    <p style="color: red;">Неверный логин или пароль</p>
{% endif %}
{% endblock %}
