<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: DejaVu Sans, sans-serif; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 15px; }
        th, td { border: 1px solid #000; padding: 4px; text-align: left; }
    </style>
</head>
<body>
    <h2>Отчёт по продажам — период: {{ period_verbose }}</h2>
    <p><strong>Суммарная выручка:</strong> {{ total_income }} ₽</p>

    <h3>Популярные блюда:</h3>
    <table>
        <tr>
            <th>Блюдо</th>
            <th>Количество продаж</th>
        </tr>
        {% for row in popular_items %}
        <tr>
            <td>{{ row.name }}</td>
            <td>{{ row.count }}</td>
        </tr>
        {% endfor %}
    </table>

    <p>Сформировано: {{ timestamp }}</p>
</body>
</html>
